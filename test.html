<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Model - Bar Selective Cel Shader</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: 'Sarabun', 'Segoe UI', sans-serif;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        
        #infoPanel {
            display: none;
            position: fixed;
            top: 50%;
            right: 30px;
            transform: translateY(-50%);
            width: 300px;
            max-width: 80vw;
            background: rgba(20,20,20,0.92);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 14px;
            padding: 20px;
            color: #fff;
            z-index: 20;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
        #infoPanel h2 {
            margin: 0 0 10px 0;
            font-size: 18px;
            color: #ff5a5f;
        }
        #infoPanel p {
            margin: 4px 0;
            font-size: 14px;
            line-height: 1.5;
            opacity: 0.9;
        }
        #infoPanel .label {
            opacity: 0.55;
            font-size: 12px;
        }
        #infoPanel button {
            margin-top: 14px;
            padding: 8px 14px;
            border: none;
            border-radius: 8px;
            background: #333;
            color: #fff;
            cursor: pointer;
        }
        #infoPanel button:hover { background: #555; }

        #hint {
            position: fixed;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.55);
            font-size: 13px;
            z-index: 5;
            pointer-events: none;
            text-align: center;
        }

        
        #btnResetCamera {
            display: none;
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            background: rgba(255, 90, 95, 0.9);
            color: #fff;
            border: none;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            z-index: 25;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: all 0.2s ease;
        }
        #btnResetCamera:hover {
            background: rgba(255, 90, 95, 1);
            transform: translateX(-50%) scale(1.05);
        }

        
        #debugBox {
            position: fixed;
            top: 14px;
            right: 14px;
            background: rgba(0,0,0,0.6);
            color: #0f0;
            font-family: monospace;
            font-size: 13px;
            padding: 8px 12px;
            border-radius: 8px;
            z-index: 30;
            display: none;
        }
    </style>
</head>
<body>

    <div id="hint">คลิกปุ่ม projects / about me / credits / picture บนผนังร้านเพื่อดูข้อมูล</div>
    <button id="btnResetCamera">← กลับมุมมองหน้าร้าน</button>
    <div id="debugBox"></div>

    
    <div id="infoPanel">
        <div id="infoPanelContent"></div>
        <button id="btnInfoClose">← กลับ</button>
    </div>

    <!-- Core Three.js & Loaders -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>

    <script>
        

        const CURTAIN_OBJECT_NAMES = [ "Plane011", "Plane012" ];

        // วัตถุที่ต้องการให้เป็น Cel Shader (เฉพาะ Circle007 ชาม และ Circle008 แก้วน้ำ)
        const TOON_OBJECT_NAMES = [ "Circle007", "Circle008" ];

        
        const portfolioData = {
            name: "ธนัญกรณ์ แสงเริองชูสิทธิ์",
            studentId: "6721601231",
            major: "วิทยาการคอมพิวเตอร์",
            faculty: "ศิลปศาสตร์และวิทยาศาสตร์",
            bio: "thanankon.sa@ku.th"
        };

        
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.01, 1000);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);

        
        renderer.outputEncoding = THREE.sRGBEncoding;

        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.0);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.2);
        directionalLight.position.set(0, 10, 10);
        scene.add(directionalLight);

        //cel shader
        function createToonGradientTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 4;
            canvas.height = 1;
            const ctx = canvas.getContext('2d');
            const shades = [80, 140, 190, 255];
            shades.forEach((v, i) => {
                ctx.fillStyle = `rgb(${v},${v},${v})`;
                ctx.fillRect(i, 0, 1, 1);
            });
            const texture = new THREE.CanvasTexture(canvas);
            texture.minFilter = THREE.NearestFilter;
            texture.magFilter = THREE.NearestFilter;
            texture.generateMipmaps = false;
            return texture;
        }
        const toonGradientMap = createToonGradientTexture();

        
        let modelRoot = null;
        let mixer = null; 

        let projectsButtonObj = null;   
        let creditsButtonObj = null; 
        let aboutmeButtonObj = null;  
        let pictureButtonObj = null; 

        let projectsTargetObj = null;   
        let creditsTargetObj = null; 
        let aboutmeTargetObj = null;  
        let pictureTargetObj = null; 

        // กำหนดตำแหน่งมุมกล้อเริ่มต้นตรงหน้าร้าน
        let defaultCamPos = new THREE.Vector3(0, 0.8, 6.8);
        let defaultCamTarget = new THREE.Vector3(0, 0.2, 0);

        // อาเรย์สำหรับเก็บวัตถุผ้าม่าน
        const curtainPlanes = [];
        const clock = new THREE.Clock();

       
        const loader = new THREE.GLTFLoader();
        const dracoLoader = new THREE.DRACOLoader();
        dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
        loader.setDRACOLoader(dracoLoader);

        loader.load('https://media.githubusercontent.com/media/ThanankornSangruangchoosit/Ball/main/Ramenbuildnolight.glb', (gltf) => {
            const model = gltf.scene;
            modelRoot = model;

            if (gltf.animations && gltf.animations.length > 0) {
                mixer = new THREE.AnimationMixer(model);
                gltf.animations.forEach((clip) => {
                    mixer.clipAction(clip).play();
                });
            }

            // ตั้งค่าหมุนโมเดลเป็น 0 เพื่อให้ตั้งตรงหน้าร้าน
            model.rotation.y = 0;

            model.traverse((node) => {
                if (!node.isMesh) return;

                const originalMap = node.material ? node.material.map : null;
                const originalColor = node.material && node.material.color
                    ? node.material.color.clone()
                    : new THREE.Color(0xffffff);

                // ตรวจสอบว่าเป็น Circle007 หรือ Circle008 หรือไม่
                const isToonTarget = TOON_OBJECT_NAMES.some(name => node.name.startsWith(name));

                if (isToonTarget) {
                    node.material = new THREE.MeshToonMaterial({
                        map: originalMap,
                        color: originalColor,
                        gradientMap: toonGradientMap,
                    });
                } else if (node.name.startsWith('Cylinder')) {
                    node.material = new THREE.MeshStandardMaterial({
                        map: originalMap,
                        color: originalColor,
                        metalness: 0.85,
                        roughness: 0.25,
                    });
                }

                if (node.name === 'Text005') projectsButtonObj = node;
                if (node.name === 'Text003') creditsButtonObj = node;
                if (node.name === 'Text004') aboutmeButtonObj = node;
                if (node.name === 'Text002') pictureButtonObj = node;

                if (node.name === 'defaultMaterial') projectsTargetObj = node;
                if (node.name === 'defaultMaterial001') creditsTargetObj = node;
                if (node.name === 'Cube006_2') aboutmeTargetObj = node;
                if (node.name === 'Object_0_1') pictureTargetObj = node;

                // ตรวจสอบผ้าม่าน Plane011 และ Plane012
                const isCurtain = CURTAIN_OBJECT_NAMES.includes(node.name) || 
                                  CURTAIN_OBJECT_NAMES.some(name => node.name.startsWith(name));

                if (isCurtain) {
                    node.userData.initialPositionY = node.position.y;
                    node.userData.initialPositionZ = node.position.z;
                    node.userData.initialRotationX = node.rotation.x;
                    
                    curtainPlanes.push(node);
                }
            });

            const box = new THREE.Box3().setFromObject(model);
            const center = box.getCenter(new THREE.Vector3());
            model.position.sub(center);

            // ตั้งค่ากล้องเริ่มต้น
            camera.position.copy(defaultCamPos);
            controls.target.copy(defaultCamTarget);
            controls.update();

            scene.add(model);
        }, undefined, (error) => {
            console.error('เกิดข้อผิดพลาดในการโหลดโมเดล:', error);
        });

        //การซูมกล้องหรือหมุน
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        renderer.domElement.addEventListener('click', (event) => {
            if (!modelRoot) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(modelRoot, true);

            if (intersects.length === 0) return;
            const hit = intersects[0].object;

            const debugBox = document.getElementById('debugBox');
            debugBox.style.display = 'block';
            debugBox.innerText = 'คลิกโดน: ' + hit.name;

            if (hit === projectsButtonObj) {
                showprojects();
            } else if (hit === creditsButtonObj) {
                showcredits();
            } else if (hit === aboutmeButtonObj) {
                showaboutme();
            } else if (hit === pictureButtonObj) {
                showpicture();
            }
        });

       
        let flyAnim = null;

        function focusOnObject(obj, distanceMultiplier = 2.2) {
            if (!obj) return;
            const box = new THREE.Box3().setFromObject(obj);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z, 0.2);

            const dir = new THREE.Vector3().subVectors(camera.position, controls.target).normalize();
            const targetCamPos = center.clone().add(dir.multiplyScalar(maxDim * distanceMultiplier));

            flyCameraTo(targetCamPos, center);
            document.getElementById('btnResetCamera').style.display = 'block';
        }

        function flyCameraTo(targetPos, targetLook, duration = 900) {
            if (flyAnim) cancelAnimationFrame(flyAnim.id);

            const startPos = camera.position.clone();
            const startTarget = controls.target.clone();
            const startTime = performance.now();

            controls.enabled = false;

            function step(now) {
                const t = Math.min((now - startTime) / duration, 1);
                const ease = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

                camera.position.lerpVectors(startPos, targetPos, ease);
                controls.target.lerpVectors(startTarget, targetLook, ease);
                controls.update();

                if (t < 1) {
                    flyAnim = { id: requestAnimationFrame(step) };
                } else {
                    controls.enabled = true;
                }
            }
            flyAnim = { id: requestAnimationFrame(step) };
        }

        function resetCamera() {
            flyCameraTo(defaultCamPos, defaultCamTarget);
            document.getElementById('btnResetCamera').style.display = 'none';
        }

        
        const infoPanelEl = document.getElementById('infoPanel');
        const infoPanelContentEl = document.getElementById('infoPanelContent');
        const hintEl = document.getElementById('hint');

        function openInfoPanel(html) {
            infoPanelContentEl.innerHTML = html;
            infoPanelEl.style.display = 'block';
            hintEl.style.display = 'none';
        }
        function closeInfoPanel() {
            infoPanelEl.style.display = 'none';
            resetCamera();
            hintEl.style.display = 'block';
        }
        document.getElementById('btnInfoClose').onclick = closeInfoPanel;
        document.getElementById('btnResetCamera').onclick = closeInfoPanel;

        function showprojects() {
            focusOnObject(projectsTargetObj, 1.6);
            openInfoPanel(`
                <h2>Ramen Shop</h2>
                <p>ร้านราเมงจำลอง 3D</p>
                <p>Portfolio</p>
                <p>3D Model Interactive Store</p>
                <p>จำลองร้านราเมง</p>
                <p>Web Integration: ออกแบบเพื่อใช้งาน</p>
                <p>ร่วมกับ HTML, CSS เพื่อสร้างเว็บไซต์ 3D</p>
                <p>เพื่อให้ผู้ใช้สามารถคลิกตอบโต้ได้</p>
            `);
        }

        function showcredits() {
            focusOnObject(creditsTargetObj, 2.0);
            openInfoPanel(``);
        }

        function showaboutme() {
            focusOnObject(aboutmeTargetObj, 1.4);
            openInfoPanel(`
               <h2>About Me</h2>
                <p><span class="label">ชื่อ-สกุล</span><br>${portfolioData.name}</p>
                <p><span class="label">รหัสนักศึกษา</span><br>${portfolioData.studentId}</p>
                <p><span class="label">สาขา</span><br>${portfolioData.major}</p>
                <p><span class="label">คณะ</span><br>${portfolioData.faculty}</p>
                <p><span class="label">อีเมล</span><br>${portfolioData.bio}</p>
            `);
        }

        function showpicture() {
            focusOnObject(pictureTargetObj, 1.4);
            openInfoPanel(`
                <h2>Photo</h2>
                <p>รูปถ่ายตัวเอง (แสดงบนโมเดล 3D ที่กล้องกำลังซูมอยู่)</p>
            `);
        }

        
        function animate() {
            controls.update();

            const delta = clock.getDelta();
            if (mixer) mixer.update(delta);

            const elapsedTime = clock.getElapsedTime();

            // ขยับผ้าม่าน
            curtainPlanes.forEach((mesh, index) => {
                const verticalWave = Math.sin(elapsedTime * 2.5 + index * 0.8) * 0.025;
                mesh.position.y = mesh.userData.initialPositionY + verticalWave;

                const pitchWave = Math.cos(elapsedTime * 2.0 + index * 0.5) * 0.06;
                mesh.rotation.x = mesh.userData.initialRotationX + pitchWave;
            });

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
